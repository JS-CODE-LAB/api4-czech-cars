name: Python syntax and grouping tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check Python syntax
        run: python -m compileall -q custom_components/skoda_public
      - name: Install pytest
        run: python -m pip install pytest pillow
      - name: Test functional classification
        run: python -m pytest -q tests/
